.gv-grid::before{content:"";position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);background-size:64px 64px;-webkit-mask-image:radial-gradient(ellipse 70% 60% at 50% 30%,#000 20%,transparent 75%);mask-image:radial-gradient(ellipse 70% 60% at 50% 30%,#000 20%,transparent 75%)}
.gv-grid-bottom::before{-webkit-mask-image:radial-gradient(ellipse 60% 70% at 50% 100%,#000 10%,transparent 70%);mask-image:radial-gradient(ellipse 60% 70% at 50% 100%,#000 10%,transparent 70%)}
.gv-ping{width:8px;height:8px;border-radius:50%;background:#22c55e;animation:gvPing 2s infinite;flex-shrink:0}
.gv-float{animation:gvFloat 6s ease-in-out infinite}
.gv-float-2{animation:gvFloat 7s ease-in-out -2s infinite}
.gv-glass{background:rgba(26,15,18,.78);-webkit-backdrop-filter:blur(14px) saturate(1.4);backdrop-filter:blur(14px) saturate(1.4);border:1px solid rgba(255,255,255,.12)}
.gv-tab{font-family:inherit;cursor:pointer;position:relative;overflow:hidden;transition:background .2s ease,color .2s ease,border-color .2s ease}
.gv-tab:hover{color:#ffffff}
.gv-bar{position:absolute;left:0;bottom:0;height:2px;width:0;background:linear-gradient(90deg,#ffb5a6,#ea382a);animation:gvBar 7s linear forwards}
.gv-marquee{overflow:hidden;-webkit-mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent);mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent)}
.gv-track{display:flex;gap:16px;width:max-content;animation:gvMq 40s linear infinite}
.gv-marquee:hover .gv-track{animation-play-state:paused}
.gv-tool{animation:gvJitter 5s ease-in-out infinite}
.gv-tool:nth-child(2){animation-delay:-1s}.gv-tool:nth-child(3){animation-delay:-2s}.gv-tool:nth-child(4){animation-delay:-3s}.gv-tool:nth-child(5){animation-delay:-4s}
.gv-spin{animation:gvSpin 60s linear infinite}
.gv-lift{transition:transform .25s ease,box-shadow .25s ease,border-color .25s ease}
.gv-lift:hover{transform:translateY(-4px);box-shadow:0 24px 50px -20px rgba(67,27,32,.35)}
.gv-foot a{color:#bfaea9;text-decoration:none;font-size:14px}
.gv-foot a:hover{color:#ffb5a6}
.gv-toggle{font-family:inherit;cursor:pointer}
.gv-tab:focus-visible,.gv-btn:focus-visible,.gv-toggle:focus-visible{outline:2px solid #ff8a78;outline-offset:3px}
@keyframes gvPing{0%{box-shadow:0 0 0 0 rgba(34,197,94,.6)}80%,100%{box-shadow:0 0 0 9px rgba(34,197,94,0)}}
@keyframes gvFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes gvBar{from{width:0}to{width:100%}}
@keyframes gvMq{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@keyframes gvJitter{0%,100%{transform:translate(0,0) rotate(-2deg)}25%{transform:translate(4px,-5px) rotate(2deg)}50%{transform:translate(-2px,3px) rotate(-1deg)}75%{transform:translate(-4px,-2px) rotate(3deg)}}
@keyframes gvSpin{to{transform:rotate(360deg)}}
@keyframes gvRv{from{opacity:0;transform:translateY(32px)}to{opacity:1;transform:none}}
@supports (animation-timeline: view()){.gv-rv{animation:gvRv linear both;animation-timeline:view();animation-range:entry 0% cover 20%}}
@media (max-width:1100px){.gv-chip{display:none !important}}
@media (max-width:900px){.gv-navlinks{display:none !important}.gv-hide-sm{display:none !important}}
@media (prefers-reduced-motion: reduce){*,*::before{animation:none !important;transition:none !important}}

.gv-billing-wrap{margin:0 auto 38px;max-width:650px}
.gv-billing-tabs{position:relative;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));padding:6px;border:1px solid #ebe3e3;border-radius:20px;background:#f7f3f2;isolation:isolate;touch-action:pan-y}
.gv-billing-indicator{position:absolute;top:6px;bottom:6px;left:6px;width:calc((100% - 12px)/4);border-radius:14px;background:linear-gradient(115deg,#ea382a,#c62c1d);box-shadow:0 8px 22px -9px rgba(214,50,33,.65);pointer-events:none;transition:transform .28s cubic-bezier(.22,.61,.36,1);z-index:-1}
.gv-billing-tab{border:0;background:transparent;color:#5b4f55;min-height:66px;padding:10px 4px;border-radius:14px;font:inherit;font-size:14px;font-weight:700;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;transition:color .2s ease}
.gv-billing-tab[aria-selected="true"]{color:#fff}
.gv-billing-tab small{font-size:10px;font-weight:600;opacity:.85}
.gv-billing-tab:focus-visible{outline:2px solid #231c20;outline-offset:2px}
.gv-billing-caption{text-align:center;font-size:12px;line-height:1.6;color:#76666c;margin:14px 0 0;min-height:38px}
.gv-plan-total{font-size:12px;line-height:1.6;opacity:.78;min-height:38px;margin:2px 0 4px}
.gv-plan-saving{display:block;font-weight:700;color:#c32c1d}
.gv-plan-saving-dark{color:#ffb5a6}
@media(max-width:600px){.gv-billing-tabs{border-radius:17px}.gv-billing-tab{font-size:12px;min-height:64px}.gv-billing-tab small{font-size:9px}.gv-billing-wrap{margin-bottom:30px}}

@keyframes gvBillingSlide{from{transform:translateX(var(--billing-from))}to{transform:translateX(var(--billing-to))}}
.gv-billing-indicator{animation:gvBillingSlide .28s cubic-bezier(.22,.61,.36,1) both}
</style>
<noscript><style>#gv-root:empty::after{content:"Ative o JavaScript para ver esta página.";display:block;padding:40px;font-family:sans-serif}</style></noscript>

      marquee: marquee, aiPoints: aiPoints, steps: steps, plans: plans,
      allPlans: allPlans, pains: pains, gains: gains, faq: faq,
      billingMonths:billingMonths, billingOptions:billingOptions,
      billingIndicator:'--billing-from:' + (billingPeriods.indexOf(self.previousBillingMonths || billingMonths)*100) + '%;--billing-to:' + (billingPeriods.indexOf(billingMonths)*100) + '%;transform:translateX(' + (billingPeriods.indexOf(billingMonths)*100) + '%)',
      billingPanelLabel:billingMonths === 1 ? 'Planos mensais' : 'Planos de ' + billingMonths + ' meses',
      billingCaption:billingMonths === 1 ? 'Escolha um período maior e veja sua economia.' : 'Valores mensais equivalentes para ' + billingMonths + ' meses. Consulte as condições de pagamento com vendas.',
      billingTouchStart:function(event){self.billingTouch = {x:event.changedTouches[0].clientX,y:event.changedTouches[0].clientY};},
      billingTouchEnd:function(event){
        if(!self.billingTouch) return;
        var dx=event.changedTouches[0].clientX-self.billingTouch.x;
        var dy=event.changedTouches[0].clientY-self.billingTouch.y;
        self.billingTouch=null;
        if(Math.abs(dx)<40 || Math.abs(dx)<Math.abs(dy)) return;
        var next=Math.max(0,Math.min(3,billingPeriods.indexOf(billingMonths)+(dx<0?1:-1)));
        chooseBilling(billingPeriods[next],false);
      },
      monthly: annual ? 'false' : 'true', annual: annual ? 'true' : 'false',
      monthlyStyle: annual ? tOff : tOn, annualStyle: annual ? tOn : tOff,
      pickMonthly: function () { self.setState({ annual: false }); },
      pickAnnual: function () { self.setState({ annual: true }); }
    };
  }
}


  var HOLE = /\{\{\s*([^}]+?)\s*\}\}/g;
  var WHOLE = /^\s*\{\{\s*([^}]+?)\s*\}\}\s*$/;
  function resolve(path, scope) {
    if (path === 'true') return true;
    if (path === 'false') return false;
    if (/^-?\d+(\.\d+)?$/.test(path)) return Number(path);
    if (/^'.*'$/.test(path)) return path.slice(1, -1);
    var parts = path.split('.'), v = scope;
    for (var i = 0; i < parts.length; i++) { if (v == null) return undefined; v = v[parts[i]]; }
    return v;
  }
  function str(v) { return v == null || v === false ? '' : String(v); }
  function truthy(v) { return !!v && !(Array.isArray(v) && v.length === 0); }

  var registry = [], registering = true;
  function renderNode(node, scope, outArr) {
    if (node.nodeType === 3) {
      var t = node.nodeValue;
      outArr.push(document.createTextNode(t.indexOf('{{') < 0 ? t : t.replace(HOLE, function (_, p) { return str(resolve(p, scope)); })));
      return;
    }
    if (node.nodeType !== 1) return;
    var tag = node.localName;
    if (tag === 'sc-for') {
      var list = resolve((node.getAttribute('list') || '').replace(WHOLE, '$1'), scope) || [];
      var as = node.getAttribute('as') || 'item';
      for (var i = 0; i < list.length; i++) {
        var s = Object.create(scope); s[as] = list[i]; s.$index = i;
        renderChildren(node, s, outArr);
      }
      return;
    }
    if (tag === 'sc-if') {
      if (truthy(resolve((node.getAttribute('value') || '').replace(WHOLE, '$1'), scope))) renderChildren(node, scope, outArr);
      return;
    }
    var el = document.importNode(node, false);
    var attrs = Array.prototype.slice.call(el.attributes);
    for (var a = 0; a < attrs.length; a++) {
      var name = attrs[a].name, val = attrs[a].value;
      if (name.indexOf('hint-') === 0) { el.removeAttribute(name); continue; }
      if (val.indexOf('{{') < 0) continue;
      var m = val.match(WHOLE);
      if (m && /^on/i.test(name)) {
        el.removeAttribute(name);
        var fn = resolve(m[1], scope);
        if (typeof fn === 'function') el.addEventListener(name.slice(2).toLowerCase(), fn);
        continue;
      }
      if (name === 'data-tpl-d') { el.removeAttribute(name); name = 'd'; }
      el.setAttribute(name, m ? str(resolve(m[1], scope)) : val.replace(HOLE, function (_, p) { return str(resolve(p, scope)); }));
    }
    var kids = [];
    renderChildren(node, scope, kids);
    for (var k = 0; k < kids.length; k++) el.appendChild(kids[k]);
    if (registering && node.hasAttribute && node.hasAttribute('data-dyn')) registry.push({ tpl: node, el: el });
    outArr.push(el);
  }
  function renderChildren(node, scope, outArr) {
    var c = node.childNodes;
    for (var i = 0; i < c.length; i++) renderNode(c[i], scope, outArr);
  }

  var comp, root, tpl;
  function applyConfig(scopeEl) {
    var links = scopeEl.querySelectorAll('[data-cfg]');
    for (var i = 0; i < links.length; i++) {
      var url = CONFIG[links[i].getAttribute('data-cfg')];
      if (url) {
        links[i].setAttribute('href', url);
        if (/^https?:/.test(url)) { links[i].setAttribute('target', '_blank'); links[i].setAttribute('rel', 'noopener'); }
      }
    }
  }
  function update() {
    if (!root) return;
    var vals = comp.renderVals();
    registering = false;
    for (var i = 0; i < registry.length; i++) {
      if (registry[i].tpl.hasAttribute('data-pricing-period') && registry[i].el.getAttribute('data-pricing-period') === String(vals.billingMonths)) continue;
      var out = [];
      renderNode(registry[i].tpl, vals, out);
      registry[i].el.replaceWith(out[0]);
      registry[i].el = out[0];
      applyConfig(out[0]);
    }
  }
  function boot() {
    tpl = document.getElementById('gv-tpl').content;
    comp = new Component({});
    if (!comp.state) comp.state = {};
    var out = [];
    renderChildren(tpl, comp.renderVals(), out);
    registering = false;
    root = document.getElementById('gv-root');
    for (var i = 0; i < out.length; i++) root.appendChild(out[i]);
    applyConfig(root);
    if (typeof comp.componentDidMount === 'function') comp.componentDidMount();
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();
